name: Build Flutter APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Holt deinen Code aus dem Repository
      - uses: actions/checkout@v4

      # Sichert deine main.dart im Hintergrund
      - name: Backup main.dart
        run: |
          if [ -f main.dart ]; then mv main.dart temp_main.dart; fi
          if [ -f lib/main.dart ]; then mv lib/main.dart temp_main.dart; fi

      # Installiert Flutter (Aktuelle Version)
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Erstellt die fehlenden Android-Projektdateien
      - name: Generate missing project infrastructure
        run: |
          flutter create --platforms=android .
          rm -f lib/main.dart
          mv temp_main.dart lib/main.dart

      # Lädt die Programmbibliotheken herunter
      - name: Install Dependencies
        run: flutter pub get

      # Baut die fertige APK-Datei
      - name: Build APK
        run: flutter build apk --release

      # Stellt das fertige Paket mit der aktuellen v4-Version bereit
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sell4more-app
          path: build/app/outputs/flutter-apk/app-release.apk
