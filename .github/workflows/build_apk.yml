name: Build Flutter APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Holt den Code aus deinem Repository
      - uses: actions/checkout@v4

      # 2. Installiert eine saubere Flutter-Umgebung
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. Erstellt ein brandneues, sauberes App-Gerüst in einem Unterordner
      - name: Create Clean App Framework
        run: |
          flutter create --platforms=android --project-name=sell4more_scanner clean_app
          
          # Kopiert deine main.dart in das neue, saubere Projekt
          if [ -f lib/main.dart ]; then
            cp lib/main.dart clean_app/lib/main.dart
          elif [ -f main.dart ]; then
            cp main.dart clean_app/lib/main.dart
          fi
          
          # Kopiert deine pubspec.yaml in das neue Projekt
          if [ -f pubspec.yaml ]; then
            cp pubspec.yaml clean_app/pubspec.yaml
          fi

      # 4. Lädt die Bibliotheken im neuen Projektordner
      - name: Install Dependencies
        run: |
          cd clean_app
          flutter pub get

      # 5. Baut die fertige APK aus dem sauberen Ordner
      - name: Build APK
        run: |
          cd clean_app
          flutter build apk --release

      # 6. Lädt die fertige APK als Download hoch (v4)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sell4more-app
          path: clean_app/build/app/outputs/flutter-apk/app-release.apk
