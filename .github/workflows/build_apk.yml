name: Build Flutter APK

on: [push, workflow_dispatch]

jobs:
  build:
    # Wir pinnen das System fest auf Ubuntu 24.04, um Konflikte mit Ubuntu 26 zu vermeiden
    runs-on: ubuntu-24.04
    steps:
      # 1. Quellcode aus dem Repository laden
      - uses: actions/checkout@v4

      # 2. Modernes Java 17 installieren (v5 beendet die Node-Deprecation)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Saubere Flutter-Umgebung bereitstellen
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. App-Gerüst im sauberen Unterordner erstellen
      - name: Create Clean App Framework
        run: |
          flutter create --platforms=android --project-name=sell4more_scanner clean_app
          
          # Vorhandene main.dart hineinkopieren
          if [ -f lib/main.dart ]; then
            cp lib/main.dart clean_app/lib/main.dart
          elif [ -f main.dart ]; then
            cp main.dart clean_app/lib/main.dart
          fi
          
          # Vorhandene pubspec.yaml hineinkopieren
          if [ -f pubspec.yaml ]; then
            cp pubspec.yaml clean_app/pubspec.yaml
          fi

      # 5. Offizielle Android-Lizenzen automatisch akzeptieren
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      # 6. Abhängigkeiten installieren
      - name: Install Dependencies
        run: |
          cd clean_app
          flutter pub get

      # 7. Die fertige APK-Datei kompilieren
      - name: Build APK
        run: |
          cd clean_app
          flutter build apk --release

      # 8. Die APK als Download bereitstellen (v4)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sell4more-app
          path: clean_app/build/app/outputs/flutter-apk/app-release.apk
