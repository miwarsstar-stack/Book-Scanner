name: Build Flutter APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. Schritt: Verzeichnisse aufräumen und main.dart sichern
      - name: Backup main.dart
        run: |
          if [ -f main.dart ]; then mv main.dart temp_main.dart; fi
          if [ -f lib/main.dart ]; then mv lib/main.dart temp_main.dart; fi

      # 2. Schritt: Flutter installieren
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. Schritt: Vollständiges Android-Projektgerüst automatisch erstellen lassen
      - name: Generate missing project infrastructure
        run: |
          flutter create --platforms=android .
          rm -f lib/main.dart
          mv temp_main.dart lib/main.dart

      # 4. Schritt: Abhängigkeiten laden
      - name: Install Dependencies
        run: flutter pub get

      # 5. Schritt: Die fertige APK bauen
      - name: Build APK
        run: flutter build apk --release

      # 6. Schritt: APK als Download bereitstellen
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: sell4more-app
          path: build/app/outputs/flutter-apk/app-release.apk
